services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zknotes
      POSTGRES_PASSWORD: zknotes
      POSTGRES_DB: zknotes
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zknotes"]
      interval: 2s
      retries: 20
volumes:
  pgdata:
